<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaBa - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #333; margin-bottom: 2rem; }
        .google-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        .google-btn:hover { background: #3367d6; }
        .loading { display: none; color: #666; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to CaBa</h1>
        <button id="googleBtn" class="google-btn">Continue with Google</button>
        <div id="loading" class="loading">Please wait...</div>
        <div id="error" class="error"></div>
    </div>

    <script type="module" src="supabase-config.js"></script>
    <script>
        const googleBtn = document.getElementById('googleBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');

        googleBtn.onclick = async () => {
            googleBtn.style.display = 'none';
            loading.style.display = 'block';
            error.textContent = '';

            try {
                const { error: authError } = await supabase.auth.signInWithOAuth({
                    provider: 'google'
                });

                if (authError) throw authError;
            } catch (err) {
                googleBtn.style.display = 'block';
                loading.style.display = 'none';
                error.textContent = 'Login failed. Please try again.';
            }
        };

        // Check if already logged in
        window.addEventListener('load', () => {
            const storedUser = sessionStorage.getItem('_auth_user');
            if (storedUser) {
                window.location.href = '/CaBa/';
            }
        });
    </script>
</body>
</html>
