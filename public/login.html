<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: https://accounts.google.com https://apis.google.com https://ssl.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; frame-src 'self' https://accounts.google.com; child-src 'self' blob: https://accounts.google.com;">
    <title>CaBa - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #333; margin-bottom: 2rem; }
        .google-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        .google-btn:hover { background: #3367d6; }
        .loading { display: none; color: #666; }
        .error { color: red; margin-top: 10px; }
        .link {
            text-align: center;
            margin-top: 1rem;
        }
        .link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to CaBa</h1>
        <button id="googleBtn" class="google-btn">Continue with Google</button>
        <div id="loading" class="loading">Please wait...</div>
        <div id="error" class="error"></div>

        <div class="link">
            <a href="signup.html">Don't have an account? Sign up</a>
        </div>
    </div>

    <script type="module" src="supabase-config.js"></script>
    <script>
        const googleBtn = document.getElementById('googleBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');

        // Check network connectivity before login
        function checkNetwork() {
            if (!navigator.onLine) {
                error.textContent = 'No internet connection. Please check your network.';
                return false;
            }
            return true;
        }

        googleBtn.onclick = async () => {
            if (!checkNetwork()) return;

            googleBtn.style.display = 'none';
            loading.style.display = 'block';
            error.textContent = '';

            try {
                // Check if Supabase is properly initialized
                if (!window.supabase) {
                    throw new Error('Authentication service not available');
                }

                const { error: authError } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: 'https://mishra-aashu.github.io/CaBa/auth-callback.html',
                        queryParams: {
                            access_type: 'offline',
                            prompt: 'consent'
                        }
                    }
                });

                if (authError) {
                    console.error('Login error:', authError);
                    throw authError;
                }
            } catch (err) {
                console.error('Login failed:', err);
                googleBtn.style.display = 'block';
                loading.style.display = 'none';
                error.textContent = err.message || 'Login failed. Please try again.';
            }
        };

        // Check if already logged in
        window.addEventListener('load', () => {
            try {
                const storedUser = sessionStorage.getItem('_auth_user');
                if (storedUser) {
                    window.location.href = '/CaBa/';
                }
            } catch (e) {
                console.error('Error checking login status:', e);
            }
        });

        // Add network status listener
        window.addEventListener('offline', () => {
            error.textContent = 'You are offline. Please check your connection.';
        });

        window.addEventListener('online', () => {
            error.textContent = '';
        });
    </script>
</body>
</html>
