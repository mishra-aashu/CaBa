<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Password Reset...</title>
    <script>
        // Extract hash parameters and redirect to the correct route
        const hash = window.location.hash;
        if (hash) {
            // Redirect to the correct reset password route with hash intact
            window.location.href = '/CaBa/reset-password' + hash;
        } else {
            // If no hash, redirect to login
            window.location.href = '/CaBa/login';
        }
    </script>
</head>
<body>
    <p>Redirecting to password reset page...</p>
</body>
</html>
