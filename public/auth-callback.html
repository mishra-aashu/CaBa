<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaBa - Authentication</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .callback-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
        }

        .loading {
            color: #667eea;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .spinner {
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #dc3545;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="logo">
            <h1>CaBa</h1>
        </div>
        <div class="spinner"></div>
        <div class="loading">Completing authentication...</div>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script type="module" src="supabase-config.js"></script>
    <script>
        // Handle Supabase OAuth callback
        async function handleAuthCallback() {
            try {
                console.log('🔐 [CALLBACK] Starting auth callback processing...');

                // Check if Supabase is available
                if (!window.supabase) {
                    throw new Error('Authentication service not available');
                }

                // Get the current session
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();

                if (sessionError) {
                    console.error('🔐 [CALLBACK] Session error:', sessionError);
                    throw new Error('Session error: ' + sessionError.message);
                }

                if (!session) {
                    console.error('🔐 [CALLBACK] No session found');
                    throw new Error('No authentication session found');
                }

                const user = session.user;
                console.log('🔐 [CALLBACK] Authenticated user:', user.email);

                // Check if user exists in database with retry logic
                let existingUser = null;
                let dbError = null;
                let retryCount = 0;
                const maxRetries = 3;

                while (retryCount < maxRetries && !existingUser) {
                    try {
                        const { data, error } = await supabase
                            .from('users')
                            .select('*')
                            .eq('email', user.email)
                            .single();

                        if (error && error.code === 'PGRST116') {
                            // User doesn't exist
                            break;
                        } else if (error) {
                            dbError = error;
                            retryCount++;
                            console.log(`🔐 [CALLBACK] Database query attempt ${retryCount} failed, retrying...`);
                            await new Promise(resolve => setTimeout(resolve, 1000));
                        } else {
                            existingUser = data;
                        }
                    } catch (queryError) {
                        console.error('🔐 [CALLBACK] Database query error:', queryError);
                        dbError = queryError;
                        retryCount++;
                        await new Promise(resolve => setTimeout(resolve, 1000));
                    }
                }

                let dbUser;

                if (!existingUser && (!dbError || dbError.code === 'PGRST116')) {
                    // User doesn't exist, create new user
                    console.log('🔐 [CALLBACK] Creating new user...');
                    const userData = {
                        id: user.id,
                        email: user.email,
                        name: user.user_metadata?.full_name || user.user_metadata?.name || user.email.split('@')[0],
                        phone: '',
                        avatar: user.user_metadata?.avatar_url || null,
                        is_online: true,
                        created_at: new Date().toISOString(),
                        last_seen: new Date().toISOString()
                    };

                    // Create user with retry logic
                    let insertError = null;
                    retryCount = 0;

                    while (retryCount < maxRetries && insertError) {
                        const { data: newUser, error } = await supabase
                            .from('users')
                            .insert([userData])
                            .select()
                            .single();

                        if (error) {
                            insertError = error;
                            retryCount++;
                            console.log(`🔐 [CALLBACK] User creation attempt ${retryCount} failed, retrying...`);
                            await new Promise(resolve => setTimeout(resolve, 1000));
                        } else {
                            dbUser = newUser;
                            break;
                        }
                    }

                    if (insertError) {
                        console.error('🔐 [CALLBACK] Failed to create user after retries:', insertError);
                        throw new Error('Failed to create user account');
                    }

                } else if (existingUser) {
                    // User exists, update their status
                    console.log('🔐 [CALLBACK] Updating existing user...');
                    await supabase
                        .from('users')
                        .update({
                            is_online: true,
                            last_seen: new Date().toISOString()
                        })
                        .eq('id', existingUser.id);

                    dbUser = existingUser;
                } else {
                    console.error('🔐 [CALLBACK] Database error after retries:', dbError);
                    throw new Error('Database error occurred');
                }

                // Store user data and redirect
                console.log('🔐 [CALLBACK] Authentication successful, redirecting...');
                sessionStorage.setItem('_auth_user', JSON.stringify(dbUser));
                window.location.href = '/CaBa/';

            } catch (error) {
                console.error('🔐 [CALLBACK] Auth callback error:', error);

                // Show error and redirect to login
                document.querySelector('.loading').style.display = 'none';
                document.querySelector('.spinner').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.style.display = 'block';
                errorDiv.textContent = error.message || 'Authentication failed';

                setTimeout(() => {
                    window.location.href = '/CaBa/login.html';
                }, 3000);
            }
        }

        // Start handling the callback
        window.addEventListener('load', () => {
            console.log('🔐 [CALLBACK] Page loaded, starting callback processing...');
            handleAuthCallback();
        });
    </script>
</body>
</html>
