<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaBa - Authentication</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .callback-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
        }

        .loading {
            color: #667eea;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .spinner {
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #dc3545;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="logo">
            <h1>CaBa</h1>
        </div>
        <div class="spinner"></div>
        <div class="loading">Completing authentication...</div>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script type="module" src="supabase-config.js"></script>
    <script>
        // Check for error parameters in URL first
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const errorCode = urlParams.get('error_code');
        const errorDescription = urlParams.get('error_description');

        if (error) {
            // Display error from URL parameters
            document.querySelector('.loading').style.display = 'none';
            document.querySelector('.spinner').style.display = 'none';
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'block';
            errorDiv.textContent = errorDescription || errorCode || error || 'Authentication failed';

            setTimeout(() => {
                window.location.href = '/CaBa/login.html';
            }, 5000);
        } else {
            // Proceed with normal auth callback handling
            async function handleAuthCallback() {
                try {
                    // Get authenticated user
                    const { data: { user }, error: userError } = await supabase.auth.getUser();

                    if (userError || !user) {
                        console.error('User error:', userError);
                        throw new Error('Authentication failed');
                    }

                    console.log('User found:', user.email);

                    // Check if user already exists by email
                    const { data: existingUser, error: dbError } = await supabase
                        .from('users')
                        .select('*')
                        .eq('email', user.email)
                        .single();

                    let dbUser;

                    if (dbError && dbError.code === 'PGRST116') {
                        // User doesn't exist, create new user
                        const userData = {
                            id: user.id,
                            email: user.email,
                            name: user.user_metadata?.full_name || user.user_metadata?.name || user.email.split('@')[0],
                            phone: '',
                            avatar: user.user_metadata?.avatar_url || null,
                            is_online: true
                        };

                        const { data: newUser, error: insertError } = await supabase
                            .from('users')
                            .insert([userData])
                            .select()
                            .single();

                        if (insertError) {
                            console.error('Insert error:', insertError);
                            throw new Error('Failed to create user: ' + insertError.message);
                        }

                        dbUser = newUser;
                    } else if (existingUser) {
                        // User exists, update their status
                        await supabase
                            .from('users')
                            .update({
                                is_online: true,
                                last_seen: new Date().toISOString()
                            })
                            .eq('id', existingUser.id);

                        dbUser = existingUser;
                    } else {
                        throw new Error('Database error occurred');
                    }

                    if (dbUser) {
                        sessionStorage.setItem('_auth_user', JSON.stringify(dbUser));
                        window.location.href = '/CaBa/';
                    } else {
                        throw new Error('No user data found');
                    }

                } catch (error) {
                    console.error('Callback error:', error);
                    document.querySelector('.loading').style.display = 'none';
                    document.querySelector('.spinner').style.display = 'none';
                    const errorDiv = document.getElementById('error');
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = error.message || 'Setup failed';

                    setTimeout(() => {
                        window.location.href = '/CaBa/login.html';
                    }, 3000);
                }
            }

            // Handle the callback when page loads with timeout
            window.addEventListener('load', () => {
                // Set a timeout to prevent infinite loading
                const timeoutId = setTimeout(() => {
                    console.error('⏰ Auth callback timeout');
                    document.querySelector('.loading').textContent = 'Authentication timeout. Redirecting...';
                    setTimeout(() => {
                        window.location.href = '/CaBa/login.html';
                    }, 2000);
                }, 10000); // 10 second timeout

                handleAuthCallback().finally(() => {
                    clearTimeout(timeoutId);
                });
            });
        }
    </script>
</body>
</html>
