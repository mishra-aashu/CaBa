<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaBa - Authentication</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .callback-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
        }

        .loading {
            color: #667eea;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .spinner {
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #dc3545;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="logo">
            <h1>CaBa</h1>
        </div>
        <div class="spinner"></div>
        <div class="loading">Completing authentication...</div>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script type="module" src="supabase-config.js"></script>
    <script>
        async function handleAuthCallback() {
            try {
                // Check for URL errors first
                const urlParams = new URLSearchParams(window.location.search);
                const urlError = urlParams.get('error');
                
                if (urlError) {
                    throw new Error('OAuth authentication failed. Please try again.');
                }

                // Get session
                const { data: { session } } = await supabase.auth.getSession();
                
                if (!session?.user) {
                    throw new Error('No session found');
                }

                const user = session.user;
                
                // Get or create user in database
                let { data: dbUser } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', user.id)
                    .single();

                // User should be created by trigger, but if not, redirect to login
                if (!dbUser) {
                    throw new Error('User not found in database');
                }

                // Update online status
                await supabase
                    .from('users')
                    .update({ is_online: true, last_seen: new Date().toISOString() })
                    .eq('id', user.id);

                // Store and redirect
                sessionStorage.setItem('_auth_user', JSON.stringify(dbUser));
                window.location.href = '/CaBa/';
                
            } catch (error) {
                document.querySelector('.loading').style.display = 'none';
                document.querySelector('.spinner').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.style.display = 'block';
                errorDiv.textContent = error.message;
                
                setTimeout(() => {
                    window.location.href = '/CaBa/login.html';
                }, 3000);
            }
        }

        // Handle the callback when page loads with timeout
        window.addEventListener('load', () => {
            // Set a timeout to prevent infinite loading
            const timeoutId = setTimeout(() => {
                console.error('⏰ Auth callback timeout');
                document.querySelector('.loading').textContent = 'Authentication timeout. Redirecting...';
                setTimeout(() => {
                    window.location.href = '/CaBa/login.html';
                }, 2000);
            }, 10000); // 10 second timeout
            
            handleAuthCallback().finally(() => {
                clearTimeout(timeoutId);
            });
        });
    </script>
</body>
</html>
