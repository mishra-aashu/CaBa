<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https: blob:; connect-src 'self' https: wss:;" />
    <title>CaBa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
    <script>
      // Check for OAuth error parameters first
      const urlParams = new URLSearchParams(window.location.search);
      const error = urlParams.get('error');
      const errorCode = urlParams.get('error_code');
      const errorDescription = urlParams.get('error_description');

      if (error) {
        // Display error and redirect to login
        alert('Authentication Error: ' + (errorDescription || errorCode || error || 'Unknown error'));
        window.location.href = '/CaBa/login.html';
      } else {
        // Check if user is authenticated, if not redirect to HTML login
        const storedUser = sessionStorage.getItem('_auth_user');
        if (!storedUser) {
          // Only redirect if we're at the root and not authenticated
          if (window.location.pathname === '/CaBa/' || window.location.pathname === '/CaBa/index.html') {
            window.location.href = '/CaBa/login.html';
          }
        }
      }
    </script>
  </body>
</html>
