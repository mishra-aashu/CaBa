<!DOCTYPE html>
<html>
<head>
    <title>Test Auth</title>
</head>
<body>
    <h1>Testing Authentication</h1>
    <button id="testGoogle">Test Google Auth</button>
    <div id="result"></div>

    <script type="module" src="supabase-config.js"></script>
    <script>
        document.getElementById('testGoogle').onclick = async () => {
            const result = document.getElementById('result');
            
            try {
                // Test 1: Check Supabase connection
                result.innerHTML += '<p>Testing Supabase connection...</p>';
                const { data: { user } } = await supabase.auth.getUser();
                result.innerHTML += `<p>Current user: ${user ? user.email : 'None'}</p>`;
                
                // Test 2: Try OAuth with different redirect
                result.innerHTML += '<p>Testing OAuth...</p>';
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/CaBa/test-auth.html'
                    }
                });
                
                if (error) {
                    result.innerHTML += `<p style="color:red">OAuth Error: ${error.message}</p>`;
                } else {
                    result.innerHTML += '<p style="color:green">OAuth initiated successfully</p>';
                }
                
            } catch (err) {
                result.innerHTML += `<p style="color:red">Error: ${err.message}</p>`;
            }
        };
        
        // Check for auth callback
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('code') || urlParams.get('access_token')) {
            document.getElementById('result').innerHTML = '<p style="color:green">Auth callback received!</p>';
        }
    </script>
</body>
</html>
