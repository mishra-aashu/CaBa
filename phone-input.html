<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaBa - Add Phone Number</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e1e5e9;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5a6fd8;
        }

        .error {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .success {
            color: #28a745;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 500;
        }

        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="logo">
            <h1>Welcome to CaBa</h1>
        </div>

        <p class="subtitle">Please add your phone number to continue using CaBa</p>

        <form id="phoneForm">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                    pattern="[0-9]{10,15}"
                    title="Please enter a valid phone number (10-15 digits)"
                />
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                Continue to CaBa
            </button>
        </form>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            Setting up your account...
        </div>

        <div id="message"></div>
    </div>

    <script type="module" src="supabase-config.js"></script>
    <script>
        const phoneForm = document.getElementById('phoneForm');
        const phoneInput = document.getElementById('phone');
        const submitBtn = document.getElementById('submitBtn');
        const loadingDiv = document.getElementById('loading');
        const messageDiv = document.getElementById('message');

        // Get user ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        function showMessage(text, type = 'error') {
            messageDiv.innerHTML = `<div class="${type}">${text}</div>`;
        }

        function showLoading(show = true) {
            loadingDiv.style.display = show ? 'block' : 'none';
            phoneForm.style.display = show ? 'none' : 'block';
        }

        phoneForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const phone = phoneInput.value.trim();

            if (!phone) {
                showMessage('Please enter your phone number');
                return;
            }

            if (!/^[0-9]{10,15}$/.test(phone)) {
                showMessage('Please enter a valid phone number (10-15 digits)');
                return;
            }

            if (!userId) {
                showMessage('Invalid session. Please try logging in again.');
                setTimeout(() => {
                    window.location.href = '/CaBa/login.html';
                }, 3000);
                return;
            }

            showLoading(true);
            messageDiv.innerHTML = '';

            try {
                // Update user with phone number
                const { error } = await supabase
                    .from('users')
                    .update({ phone: phone })
                    .eq('id', userId);

                if (error) throw error;

                // Get updated user data
                const { data: userData, error: fetchError } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', userId)
                    .single();

                if (fetchError) throw fetchError;

                // Store in sessionStorage
                sessionStorage.setItem('_auth_user', JSON.stringify(userData));

                // Redirect to app
                window.location.href = '/CaBa/';
            } catch (error) {
                console.error('Error updating phone:', error);
                showLoading(false);
                showMessage('Failed to update phone number. Please try again.');
            }
        });

        // Check if already has phone
        window.addEventListener('load', async () => {
            if (!userId) {
                showMessage('Invalid session. Redirecting to login...');
                setTimeout(() => {
                    window.location.href = '/CaBa/login.html';
                }, 3000);
                return;
            }

            try {
                const { data: userData, error } = await supabase
                    .from('users')
                    .select('phone')
                    .eq('id', userId)
                    .single();

                if (error) {
                    showMessage('User not found. Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = '/CaBa/login.html';
                    }, 3000);
                    return;
                }

                if (userData.phone && userData.phone.trim() !== '') {
                    // Already has phone, redirect to app
                    sessionStorage.setItem('_auth_user', JSON.stringify(userData));
                    window.location.href = '/CaBa/';
                }
            } catch (error) {
                console.error('Error checking user:', error);
            }
        });
    </script>
</body>
</html>
